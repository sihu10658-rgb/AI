<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다운로드 센터</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #161b26;
            --border-color: #232a3b;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        .header {
            margin-bottom: 40px;
        }

        .badge {
            display: inline-block;
            background: rgba(59, 130, 246, 0.1);
            color: var(--accent-color);
            border: 1px solid rgba(59, 130, 246, 0.2);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .download-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .download-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 28px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s, border-color 0.2s;
        }

        .download-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-color);
        }

        .icon {
            font-size: 2.5rem;
            margin-bottom: 16px;
        }

        .download-card h3 {
            font-size: 1.25rem;
            margin-bottom: 8px;
        }

        .version-info {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: 20px;
        }

        .btn-download {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            text-decoration: none;
            padding: 12px 0;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            text-align: center;
            transition: background-color 0.2s;
            display: inline-block;
        }

        .btn-download:hover {
            background-color: var(--accent-hover);
        }

        .footer-note {
            color: var(--text-secondary);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span class="badge">🚀 v1.0 최신 버전 Release</span>
        <h1>원하는 버전을 설치하세요</h1>
        <p>로그인 없이 클릭 한 번으로 바로 다운로드가 시작됩니다.</p>
    </div>

    <div class="download-grid">
        <!-- Windows 설치 파일 다운로드 -->
        <div class="download-card">
            <div class="icon">🪟</div>
            <h3>Windows</h3>
            <div class="version-info">64-bit (exe)</div>
            <a href="files/app-setup-win.exe" download class="btn-download">Windows 설치 파일</a>
        </div>

        <!-- macOS 설치 파일 다운로드 -->
        <div class="download-card">
            <div class="icon">🍎</div>
            <h3>macOS</h3>
            <div class="version-info">Apple Silicon / Intel (dmg)</div>
            <a href="files/app-setup-mac.dmg" download class="btn-download">macOS 설치 파일</a>
        </div>

        <!-- Linux 설치 파일 다운로드 -->
        <div class="download-card">
            <div class="icon">🐧</div>
            <h3>Linux</h3>
            <div class="version-info">Debian / Ubuntu (AppImage)</div>
            <a href="files/app-setup-linux.AppImage" download class="btn-download">Linux 설치 파일</a>
        </div>
    </div>

    <div class="footer-note">
        설치 중 문제가 생기시면 문서 및 고객 지원 가이드를 참고하세요.
    </div>
</div>

</body>
</html>
